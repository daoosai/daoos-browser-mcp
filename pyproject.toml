[project]
name = "daoos-browser-mcp"
version = "0.1.0"
description = "Tenant-isolated Playwright browser executor with MCP and shared noVNC"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.3.0", "playwright==1.64.1", "fastapi==0.162.0", "uvicorn==0.49.0",
  "sqlalchemy==2.0.48", "psycopg[binary]==3.3.3", "cryptography==50.0.2",
  "psutil==7.2.2", "mss==10.2.0", "Pillow==13.0.0", "httpx==0.28.1", "python-multipart==0.0.33", "websockets==17.4"
]
[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.5.0"]
[project.scripts]
daoos-browser = "browser.cli:main"
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["browser*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
browser = ["openbox.xml"]
